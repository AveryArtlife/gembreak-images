  <g transform="translate(362 214) scale(0.84) translate(-362 -214)"><path d="M342 162 C 394 166, 424 224, 402 266 C 382 292, 334 276, 312 248 C 306 214, 316 178, 342 162 Z" fill="#0A0A0E" stroke="#3E3E48" stroke-width="3"/></g>
  <path d="M170 186 C 146 196, 134 224, 140 248" fill="none" stroke="#3E3E48" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <path d="M342 186 C 366 196, 378 224, 372 248" fill="none" stroke="#3E3E48" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

