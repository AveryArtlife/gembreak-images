  <path d="M224 214 q 32 -18 64 0" fill="none" stroke="#56566A" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  <path d="M236 196 q 20 -10 40 0" fill="none" stroke="#56566A" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

  <!-- eyes: big, round, brown, looking up a little (the leash photo) -->
  <g>
    <ellipse cx="203" cy="292" rx="37" ry="41" fill="#FFFFFF" stroke="#050506" stroke-width="5"/>
    <circle cx="206" cy="289" r="28" fill="url(#iris)"/>
    <circle cx="208" cy="291" r="17" fill="#07050A"/>
    <circle cx="216" cy="279" r="8" fill="#FFFFFF"/>
    <circle cx="198" cy="302" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <g>
    <ellipse cx="309" cy="292" rx="37" ry="41" fill="#FFFFFF" stroke="#050506" stroke-width="5"/>
    <circle cx="306" cy="289" r="28" fill="url(#iris)"/>
    <circle cx="304" cy="291" r="17" fill="#07050A"/>
    <circle cx="312" cy="279" r="8" fill="#FFFFFF"/>
    <circle cx="295" cy="302" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- nose + jowl folds -->
  <path d="M230 316 C 238 300, 274 300, 282 316 C 285 328, 271 340, 256 340 C 241 340, 227 328, 230 316 Z" fill="#050506"/>
  <ellipse cx="246" cy="315" rx="6" ry="3.5" fill="#FFFFFF" opacity="0.28"/>
  <path d="M196 344 q 18 -14 40 -4" fill="none" stroke="#4A4A58" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M316 344 q -18 -14 -40 -4" fill="none" stroke="#4A4A58" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <!-- philtrum + underbite smile -->
  <path d="M256 340 v 12" stroke="#050506" stroke-width="5" stroke-linecap="round"/>
  <path d="M220 352 q 36 30 72 0" fill="none" stroke="#050506" stroke-width="5" stroke-linecap="round"/>
  <path d="M232 366 q 24 10 48 0" fill="none" stroke="#6E6E7C" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- tongue tip -->
  <path d="M248 366 h 16 a 8 8 0 0 1 8 8 v 4 a 16 16 0 0 1 -32 0 v -4 a 8 8 0 0 1 8 -8 z" fill="#F08A9B"/>

  <!-- pink braided collar (her leash) -->
  <path d="M124 392 C 166 470, 346 470, 388 392" fill="none" stroke="url(#collarPink)" stroke-width="22" stroke-linecap="round"/>
  <path d="M124 392 C 166 470, 346 470, 388 392" fill="none" stroke="#FFD1E4" stroke-width="7" stroke-linecap="round" stroke-dasharray="12 11" opacity="0.85"/>
  <path d="M124 392 C 166 470, 346 470, 388 392" fill="none" stroke="#C94F86" stroke-width="7" stroke-linecap="round" stroke-dasharray="12 11" stroke-dashoffset="11" opacity="0.6"/>
  <!-- clasp + star tag -->
  <circle cx="256" cy="446" r="12" fill="none" stroke="#D8DDE5" stroke-width="5"/>
  <circle cx="256" cy="468" r="24" fill="url(#tag)" stroke="#B87A08" stroke-width="3"/>
  <path d="M256 452 l 4.8 10.2 11.2 1.3 -8.3 7.7 2.2 11.1 -9.9 -5.6 -9.9 5.6 2.2 -11.1 -8.3 -7.7 11.2 -1.3 z" fill="#1B1B1F"/>
</g><text font-family="Fredoka, 'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="25" letter-spacing="3.5" fill="#1B1B1F"><textPath href="#rimPath" startOffset="0">CHA CHA FOREVER ✦ $CHA ✦ CHA CHA FOREVER ✦ $CHA ✦</textPath></text>
</svg>
