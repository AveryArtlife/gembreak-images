<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="$CHA coin">
  <defs>
    <radialGradient id="furB" cx="40%" cy="30%" r="78%">
      <stop offset="0" stop-color="#4E4E58"/>
      <stop offset="0.42" stop-color="#25252C"/>
      <stop offset="1" stop-color="#0B0B0F"/>
    </radialGradient>
    <radialGradient id="sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8A8A98" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8A8A98" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="muzzleB" cx="50%" cy="35%" r="70%">
