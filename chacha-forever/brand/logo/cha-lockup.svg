<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480" role="img" aria-label="Cha Cha Forever lockup">
  <defs>
    <radialGradient id="fur" cx="42%" cy="32%" r="75%"><stop offset="0" stop-color="#F6E2B5"/><stop offset="0.6" stop-color="#E9C98F"/><stop offset="1" stop-color="#CFA463"/></radialGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE994"/><stop offset="0.5" stop-color="#F5B82E"/><stop offset="1" stop-color="#C98A0E"/></linearGradient>
    <radialGradient id="mask" cx="50%" cy="38%" r="68%"><stop offset="0" stop-color="#45454C"/><stop offset="1" stop-color="#1B1B1F"/></radialGradient>
    <radialGradient id="tag" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#FFE994"/><stop offset="1" stop-color="#D9960F"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE994"/><stop offset="0.45" stop-color="#F5B82E"/><stop offset="1" stop-color="#B87A08"/></linearGradient>
    <radialGradient id="face" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#1E2A4A"/><stop offset="1" stop-color="#0B0F1A"/></radialGradient>
    <radialGradient id="night" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#1E2A4A"/><stop offset="1" stop-color="#0B0F1A"/></radialGradient>
  </defs>
  <g transform="translate(30 20) scale(0.86)"><circle cx="256" cy="256" r="254" fill="url(#rim)"/><circle cx="256" cy="256" r="254" fill="none" stroke="#9A6606" stroke-width="3"/><circle cx="256" cy="256" r="208" fill="url(#face)" stroke="#9A6606" stroke-width="4"/><circle cx="256" cy="256" r="200" fill="none" stroke="#F5B82E" stroke-width="2" opacity="0.5"/><g transform="translate(256 262) scale(0.74) translate(-256 -262)">  <!-- halo (slightly slipped, because pug) -->
  <g transform="rotate(-12 256 92)">
    <ellipse cx="256" cy="92" rx="116" ry="28" fill="none" stroke="#B87A08" stroke-width="26" opacity="0.35"/>
    <ellipse cx="256" cy="92" rx="116" ry="28" fill="none" stroke="url(#halo)" stroke-width="22"/>
    <ellipse cx="256" cy="86" rx="112" ry="24" fill="none" stroke="#FFF6D1" stroke-width="4" opacity="0.75"/>
  </g>

  <!-- head -->
  <circle cx="256" cy="302" r="150" fill="url(#fur)"/>
  <!-- soft mask blend -->
  <ellipse cx="256" cy="348" rx="116" ry="96" fill="#1B1B1F" opacity="0.22"/>
  <!-- muzzle mask -->
  <ellipse cx="256" cy="346" rx="98" ry="78" fill="url(#mask)"/>

  <!-- ears, folded over the top edge of the head -->
  <path d="M170 162 C 118 166, 88 224, 110 266 C 130 292, 178 276, 200 248 C 206 214, 196 178, 170 162 Z" fill="#1B1B1F"/>
  <path d="M342 162 C 394 166, 424 224, 402 266 C 382 292, 334 276, 312 248 C 306 214, 316 178, 342 162 Z" fill="#1B1B1F"/>
  <path d="M168 176 C 136 184, 118 222, 128 252" fill="none" stroke="#3A3A40" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M344 176 C 376 184, 394 222, 384 252" fill="none" stroke="#3A3A40" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- forehead wrinkles -->
  <path d="M214 232 q 42 -24 84 0" fill="none" stroke="#B88B48" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M226 212 q 30 -18 60 0" fill="none" stroke="#B88B48" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- eyes -->
  <g>
    <ellipse cx="203" cy="292" rx="35" ry="39" fill="#FFFFFF" stroke="#1B1B1F" stroke-width="5"/>
    <circle cx="208" cy="298" r="23" fill="#1B1B1F"/>
    <circle cx="216" cy="286" r="8" fill="#FFFFFF"/>
    <circle cx="199" cy="308" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <g>
    <ellipse cx="309" cy="292" rx="35" ry="39" fill="#FFFFFF" stroke="#1B1B1F" stroke-width="5"/>
    <circle cx="304" cy="298" r="23" fill="#1B1B1F"/>
    <circle cx="312" cy="286" r="8" fill="#FFFFFF"/>
    <circle cx="295" cy="308" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- cheeks -->
  <circle cx="146" cy="336" r="17" fill="#F4A7B3" opacity="0.5"/>
  <circle cx="366" cy="336" r="17" fill="#F4A7B3" opacity="0.5"/>

  <!-- nose -->
  <path d="M232 314 C 240 300, 272 300, 280 314 C 283 326, 270 338, 256 338 C 242 338, 229 326, 232 314 Z" fill="#0E0E10"/>
  <ellipse cx="247" cy="314" rx="5" ry="3" fill="#FFFFFF" opacity="0.25"/>
  <!-- philtrum + smile -->
  <path d="M256 338 v 14" stroke="#0E0E10" stroke-width="5" stroke-linecap="round"/>
  <path d="M224 350 q 32 30 64 0" fill="none" stroke="#0E0E10" stroke-width="5" stroke-linecap="round"/>
  <!-- tongue -->
  <path d="M248 365 h 18 a 9 9 0 0 1 9 9 v 6 a 18 18 0 0 1 -36 0 v -6 a 9 9 0 0 1 9 -9 z" fill="#F08A9B"/>
  <path d="M257 368 v 18" stroke="#D9657A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- collar + tag -->
  <path d="M126 394 C 168 468, 344 468, 386 394" fill="none" stroke="#E63946" stroke-width="20" stroke-linecap="round"/>
  <path d="M126 394 C 168 468, 344 468, 386 394" fill="none" stroke="#FF8A94" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <circle cx="256" cy="450" r="27" fill="url(#tag)" stroke="#B87A08" stroke-width="3"/>
  <path d="M256 433 l 5.2 11.2 12.2 1.4 -9 8.4 2.4 12.1 -10.8 -6.1 -10.8 6.1 2.4 -12.1 -9 -8.4 12.2 -1.4 z" fill="#1B1B1F"/></g></g>
  <text x="520" y="250" font-family="Fredoka, 'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="190" fill="#F8F7F2" stroke="#0B0F1A" stroke-width="10" paint-order="stroke" letter-spacing="-3">CHA CHA</text>
  <text x="526" y="360" font-family="Fredoka, 'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="74" fill="url(#halo)" stroke="#0B0F1A" stroke-width="8" paint-order="stroke" letter-spacing="24">FOREVER</text>
  <rect x="1206" y="296" width="200" height="74" rx="37" fill="#F5B82E"/>
  <text x="1306" y="348" text-anchor="middle" font-family="Fredoka, 'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="46" fill="#1B1B1F">$CHA</text>
</svg>
